name: Azure Static Web Apps CI/CD
 
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master
 
jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    permissions:
       id-token: write
       contents: read
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
          
      - name: Restore Dependencies
        run: dotnet restore
      
      - name: Build and Publish
        run: dotnet publish -c Release -o ./published-output
      
      # This step will create a simple package.json file
      - name: Create package.json for static web apps
        run: |
          echo '{
            "name": "mindcare-static",
            "version": "1.0.0",
            "scripts": {
              "build": "echo Static content already built by .NET"
            }
          }' > ./published-output/wwwroot/package.json
      
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_WATER_0998E2C0F }}
          action: "upload"
          app_location: "./published-output/wwwroot" # Location of your pre-built static files
          api_location: "" # No API
          output_location: "" # Already built
          skip_app_build: true # Skip the built-in Oryx build
          app_build_command: "echo 'Skipping build as content is pre-built'" # Fallback command
          github_id_token: ${{ secrets.GITHUB_TOKEN }}
  
  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_WATER_0998E2C0F }}
          action: "close"
